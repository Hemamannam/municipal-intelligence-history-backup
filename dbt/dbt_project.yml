name: municipal_intelligence
version: "1.0.0"
profile: municipal_intelligence

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  # Mirrors ERConfig.auto_match_threshold; the custom test
  # assert_auto_matches_above_threshold enforces agreement.
  er_auto_match_threshold: 0.90
  # Complaint types treated as emergency-severity for risk weighting.
  emergency_complaint_types:
    - "HEAT/HOT WATER"
    - "NO WATER"
    - "ELECTRIC"
    - "GAS"
    - "PLUMBING"
    - "WATER LEAK"
    - "ELEVATOR"
    - "STRUCTURAL"

models:
  municipal_intelligence:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
