[project]
name = "municipal-intelligence"
version = "0.1.0"
description = "Multi-Source Municipal Intelligence Platform: unifies NYC 311 complaints, DOB permits, and business licenses into canonical property/owner/business entities."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "duckdb>=1.0",
    "pandas>=2.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "usaddress>=0.5",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ingestion", "ingestion.sources", "ingestion.loaders", "ingestion.schemas", "entity_resolution", "normalization"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
