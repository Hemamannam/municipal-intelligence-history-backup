# Local analytics + orchestration stack.
#
#   make up          -> postgres + metabase
#   make publish     -> copy marts DuckDB -> Postgres
#   make dashboard   -> provision Metabase (cards + dashboards) via API
#   make airflow-up  -> build & start Airflow (nightly DAG)
#
# DuckDB stays the transformation engine (single-writer, embedded, fast);
# Postgres is the *serving* layer Metabase reads. Credentials here are
# local-development defaults only — override via .env for anything shared.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PG_USER:-mip}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-mip_local_dev}
      POSTGRES_DB: ${PG_DB:-mip}
    ports:
      - "${PG_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-mip}"]
      interval: 5s
      timeout: 3s
      retries: 10

  metabase:
    image: metabase/metabase:v0.50.26
    ports:
      - "${METABASE_PORT:-3000}:3000"
    environment:
      MB_DB_TYPE: h2  # metadata db; fine for local demo
    volumes:
      - mb_data:/metabase.db
    depends_on:
      postgres:
        condition: service_healthy

  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    profiles: ["airflow"]  # started explicitly via make airflow-up
    command: standalone
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/mip/airflow/dags
      MIP_DUCKDB_PATH: /opt/mip/data/warehouse/mip.duckdb
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: ${PG_USER:-mip}
      PG_PASSWORD: ${PG_PASSWORD:-mip_local_dev}
      PG_DB: ${PG_DB:-mip}
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-mip_local_dev}
    volumes:
      - ./data:/opt/mip/data
      - ./airflow/dags:/opt/mip/airflow/dags
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  mb_data:
